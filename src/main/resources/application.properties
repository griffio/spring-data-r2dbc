spring.application.name=demo
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/salesfarce
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres

spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/salesfarce
spring.flyway.user=${spring.r2dbc.username}
spring.flyway.password=${spring.r2dbc.password}
spring.flyway.locations=classpath:db/migration
# Flyway will not migrate non-empty schema that does not have a Flyway schema history table.
# e.g. reports error; Found non-empty schema(s) ?public? but no schema history table.
# If so, use baselineOnMigrate to true to initialize the schema history table.
#spring.flyway.baseline-version=0
#spring.flyway.baseline-on-migrate=true

logging.level.org.springframework.r2dbc=DEBUG
logging.level.org.flywaydb=DEBUG
